name: Fetch Vakio coupon

# Stage 1 of three. This job only captures the coupon — it never publishes a
# round, because a round needs forecasts and those are written by hand before
# kickoff. It opens a PR; you add the forecasts and merge.
#
# It must NOT push to main. A fetched draft has no matchIds and no forecasts, so
# it cannot satisfy the Round schema, and pushing it to main would fail
# `prebuild` on Vercel and take the site's build down.
#
# Schedule history: originally polled 3x/day, Tue–Fri (cron "0 6,12,18 * * 2,3,4,5"),
# to catch the coupon's publication time without guessing it. Veikkaus reliably
# publishes Lauantaivakio Monday or Tuesday, so that margin turned out to be
# unnecessary — and the polling caused a real bug: `concurrency` below queues
# overlapping runs rather than skipping them, and because a draft only ever
# lives on an unmerged PR branch (never on `main`), a same-day second run's
# fresh checkout has no way to see that an earlier run that day already
# succeeded. It re-fetches, sees "new" files against `main`, and tries to push
# a branch (`coupon/$DATE`) that the earlier run already created — a rejected
# non-fast-forward push. Moved to a single Thursday cron, then dropped the
# schedule entirely: GitHub's scheduler queues on-the-hour crons behind every
# other hourly job on the platform and can run them hours late (or drop them),
# which made "did it run yet" its own weekly question. Manual only now — run
# it yourself via "Run workflow" whenever that week's coupon is out, same
# Thursday-ish cadence as before. The guard step below still matters: it's
# what makes a retry after a failed run safe.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fetch-vakio
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # At once-a-week, hand-triggered frequency the same-day race above can't
      # recur under normal operation. This guard covers the remaining
      # realistic case: a second "Run workflow" click — e.g. retrying after a
      # failed run — firing while that week's draft PR is still open and
      # unmerged. Placed
      # before checkout so a doomed run doesn't call the fetch endpoint at
      # all; the endpoint drops closed coupons permanently, so calls to it
      # aren't free to waste.
      - name: Skip if this week's draft PR is already open
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "coupon/$DATE" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Draft PR #$EXISTING for $DATE already open — skipping run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: Fetch open Vakio draws
        if: steps.guard.outputs.skip != 'true'
        run: npx tsx scripts/fetch-vakio.ts

      - name: Stop if nothing new
        id: check
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -z "$(git status --porcelain data/rounds)" ]; then
            echo "No new coupon."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Drafts live under data/rounds/drafts/ which validate.ts ignores, so this
      # is a belt-and-braces check that the fetch touched nothing else.
      - name: Validate
        if: steps.guard.outputs.skip != 'true' && steps.check.outputs.changed == 'true'
        run: npm run validate

      - name: Open PR with the draft
        if: steps.guard.outputs.skip != 'true' && steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="coupon/$DATE"

          git config user.name  "strictlane-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/rounds
          # The commit timestamp is external evidence of when the coupon was
          # captured — stronger than any self-reported field, which matters for a
          # site whose premise is that forecasts are never backfilled.
          git commit -m "Coupon draft $DATE"
          git push -u origin "$BRANCH"

          gh pr create --title "Coupon draft $DATE" --body-file - <<'BODY'
          Fetched from the Veikkaus open-games endpoint. **Not publishable yet.**

          To finish:

          1. Add any missing fixtures to the relevant `data/{season}/{league}/mw-NN.json`
          2. Write a forecast on each coupon match — `probs`, `marks`, and a
             `capturedAt` **before kickoff**
          3. `npx tsx scripts/promote-round.ts <round-id>` to build the round file
          4. `npm run validate`, then merge

          The raw API payload is committed alongside the draft. The open-games
          endpoint drops closed coupons permanently, so that snapshot is the only
          copy that will ever exist.
          BODY
