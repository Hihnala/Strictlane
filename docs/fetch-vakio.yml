name: Fetch Vakio coupon

# The open-games endpoint returns ONLY open draws. Once a coupon closes it is
# gone from the API and cannot be retrieved again, so this runs often enough to
# catch the publication window rather than once a week at a guessed hour.
on:
  schedule:
    - cron: "0 6,12,18 * * 2,3,4,5"   # Tue–Fri, 06/12/18 UTC — coupons publish midweek
  workflow_dispatch:                   # manual run

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch open Vakio draws
        run: npx tsx scripts/fetch-vakio.ts

      - name: Validate
        run: npm run validate -- --warn-only

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/rounds)" ]; then
            echo "No new coupon."
            exit 0
          fi
          git config user.name  "strictlane-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/rounds
          # The commit timestamp is the provenance: it proves the coupon was
          # captured before kickoff far better than a self-reported field can.
          git commit -m "Fetch Vakio coupon $(date -u +%Y-%m-%d)"
          git push
